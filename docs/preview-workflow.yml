# Install as .github/workflows/preview.yml in davvidk/testris-preview.
name: Tetris PR-Vorschau
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR-Nummer aus davvidk/tetris (leer = neuester offener PR, sonst main)'
        required: false
        type: string
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: tetris-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Vorschau-Commit bestimmen
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_PR" ]]; then
            [[ "$REQUESTED_PR" =~ ^[1-9][0-9]*$ ]] || { echo 'Ungültige PR-Nummer'; exit 1; }
            sha=$(gh api "repos/davvidk/tetris/pulls/$REQUESTED_PR" --jq '.head.sha')
          else
            sha=$(gh api 'repos/davvidk/tetris/pulls?state=open&sort=updated&direction=desc&per_page=1' --jq '.[0].head.sha // empty')
            if [[ -z "$sha" ]]; then
              sha=$(gh api repos/davvidk/tetris/commits/main --jq '.sha')
            fi
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Vorschau für Commit $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          repository: davvidk/tetris
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser-Testwerkzeuge installieren
        run: |
          npm install --prefix "$RUNNER_TEMP/tetris-tests" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/tetris-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Vorschau testen
        env:
          NODE_PATH: ${{ runner.temp }}/tetris-tests/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/tetris-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/smoke.cjs
      - name: Statische Website vorbereiten
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/preview-site"
          cp index.html "$RUNNER_TEMP/preview-site/index.html"
          touch "$RUNNER_TEMP/preview-site/.nojekyll"
          printf '{"repository":"davvidk/tetris","commit":"%s"}\n' "$SOURCE_SHA" > "$RUNNER_TEMP/preview-site/preview.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/preview-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
