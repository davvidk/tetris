name: Branch testen

on:
  push:
    branches: ['feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testwerkzeuge installieren
        run: |
          npm install --prefix "$RUNNER_TEMP/tetris-tests" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/tetris-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Cloudflare-Ausgabe bauen
        run: bash scripts/build-preview.sh
      - name: Desktop und Touch testen
        env:
          NODE_PATH: ${{ runner.temp }}/tetris-tests/node_modules
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/tetris-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/smoke.cjs
